name: Refresh profile visuals

on:
  schedule:
    # 06:17 Asia/Shanghai, on the following calendar day.
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-refresh.yml
      - .github/profile-3d-settings.json
      - .github/profile-media.json
      - scripts/check_profile.py
      - scripts/build_media_preset.py
      - assets/covers/**
      - README.md

permissions: {}

concurrency:
  group: profile-refresh-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Generate and validate public profile images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove previous outputs from this runner
        run: |
          rm -f -- \
            profile/stats-light.svg \
            profile/stats-dark.svg \
            profile/top-langs-light.svg \
            profile/top-langs-dark.svg \
            profile/snake-light.svg \
            profile/snake-dark.svg \
            profile/media.svg \
            profile-3d-contrib/profile-custom.svg

      - name: Generate public statistics for light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/stats-light.svg
          options: >-
            {"username":"${{ github.repository_owner }}","show_icons":true,"hide_rank":true,"include_all_commits":false,"disable_animations":true,"bg_color":"ffffff","title_color":"5368d6","icon_color":"7c6bd6","text_color":"24292f","border_color":"d0d7de"}

      - name: Generate public statistics for dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/stats-dark.svg
          options: >-
            {"username":"${{ github.repository_owner }}","show_icons":true,"hide_rank":true,"include_all_commits":false,"disable_animations":true,"bg_color":"0d1117","title_color":"8ea8ff","icon_color":"a78bfa","text_color":"c9d1d9","border_color":"30363d"}

      - name: Generate public repository languages for light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/top-langs-light.svg
          options: >-
            {"username":"${{ github.repository_owner }}","layout":"compact","langs_count":8,"disable_animations":true,"bg_color":"ffffff","title_color":"5368d6","text_color":"24292f","border_color":"d0d7de"}

      - name: Generate public repository languages for dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/top-langs-dark.svg
          options: >-
            {"username":"${{ github.repository_owner }}","layout":"compact","langs_count":8,"disable_animations":true,"bg_color":"0d1117","title_color":"8ea8ff","text_color":"c9d1d9","border_color":"30363d"}

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            profile/snake-light.svg?color_snake=#7c6bd6&color_dots=#eef1f8,#d5dbf8,#b2bdf1,#8e9ae8,#6574db
            profile/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#303450,#515789,#7379bd,#9a9cf6

      - name: Generate contribution city with light and dark palettes
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Prepare the media card preset
        run: |
          set -euo pipefail
          python3 scripts/build_media_preset.py --output "$RUNNER_TEMP/media-preset.json"
          # Metrics mounts this runner directory at /renders in its container.
          sudo install -D -m 644 -- "$RUNNER_TEMP/media-preset.json" /metrics_renders/media-preset.json

      - name: Generate anime and visual novel cards with light and dark palettes
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34.0
        with:
          token: NOT_NEEDED
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          base_skip: yes
          output_action: none
          filename: media.svg
          config_presets: /renders/media-preset.json
          config_output: svg
          config_display: regular
          config_padding: 0, 8
          config_animations: no
          # The preset already embeds every local cover as a data URI.
          config_base64: no
          config_timezone: Asia/Shanghai
          notice_releases: no
          optimize: xml

      - name: Collect the rendered media card
        run: install -D -m 644 -- /metrics_renders/media.svg profile/media.svg

      - name: Validate all eight generated images
        run: python3 scripts/check_profile.py --generated

      - name: Upload only validated images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-images
          overwrite: true
          if-no-files-found: error
          retention-days: 3
          path: |
            profile/stats-light.svg
            profile/stats-dark.svg
            profile/top-langs-light.svg
            profile/top-langs-dark.svg
            profile/snake-light.svg
            profile/snake-dark.svg
            profile/media.svg
            profile-3d-contrib/profile-custom.svg

  publish:
    name: Publish validated images
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out this run's source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Download this run's validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-images
          path: ${{ runner.temp }}/profile-generated
          digest-mismatch: error

      - name: Copy the eight expected images
        env:
          PROFILE_ARTIFACT_DIR: ${{ runner.temp }}/profile-generated
        run: |
          set -euo pipefail
          for profile_file in \
            profile/stats-light.svg \
            profile/stats-dark.svg \
            profile/top-langs-light.svg \
            profile/top-langs-dark.svg \
            profile/snake-light.svg \
            profile/snake-dark.svg \
            profile/media.svg \
            profile-3d-contrib/profile-custom.svg
          do
            install -D -m 644 -- "$PROFILE_ARTIFACT_DIR/$profile_file" "$profile_file"
          done

      - name: Validate downloaded images
        run: python3 scripts/check_profile.py --generated

      - name: Commit and push only generated images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            profile/stats-light.svg \
            profile/stats-dark.svg \
            profile/top-langs-light.svg \
            profile/top-langs-dark.svg \
            profile/snake-light.svg \
            profile/snake-dark.svg \
            profile/media.svg \
            profile-3d-contrib/profile-custom.svg
          if git diff --cached --quiet; then
            echo "Profile images are already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated visuals"
          git push origin HEAD:main
