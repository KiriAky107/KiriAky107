name: Refresh profile visuals

on:
  schedule:
    # 06:17 Asia/Shanghai, on the following calendar day.
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-refresh.yml
      - .github/profile-3d-settings.json
      - scripts/check_profile.py
      - README.md

permissions: {}

concurrency:
  group: profile-refresh-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Generate and validate public profile images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove previous outputs from this runner
        run: |
          rm -f -- \
            profile/stats-light.svg \
            profile/stats-dark.svg \
            profile/top-langs-light.svg \
            profile/top-langs-dark.svg \
            profile/snake-light.svg \
            profile/snake-dark.svg \
            profile-3d-contrib/profile-custom.svg

      - name: Generate public statistics for light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/stats-light.svg
          options: >-
            {"username":"${{ github.repository_owner }}","show_icons":true,"hide_rank":true,"include_all_commits":false,"disable_animations":true,"bg_color":"ffffff","title_color":"b9404b","icon_color":"b9404b","text_color":"24292f","border_color":"d0d7de"}

      - name: Generate public statistics for dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/stats-dark.svg
          options: >-
            {"username":"${{ github.repository_owner }}","show_icons":true,"hide_rank":true,"include_all_commits":false,"disable_animations":true,"bg_color":"0d1117","title_color":"f0747a","icon_color":"f0747a","text_color":"c9d1d9","border_color":"30363d"}

      - name: Generate public repository languages for light mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/top-langs-light.svg
          options: >-
            {"username":"${{ github.repository_owner }}","layout":"compact","langs_count":8,"disable_animations":true,"bg_color":"ffffff","title_color":"b9404b","text_color":"24292f","border_color":"d0d7de"}

      - name: Generate public repository languages for dark mode
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          core_version: 2.2.0
          token: ${{ github.token }}
          fail_on_error: true
          path: profile/top-langs-dark.svg
          options: >-
            {"username":"${{ github.repository_owner }}","layout":"compact","langs_count":8,"disable_animations":true,"bg_color":"0d1117","title_color":"f0747a","text_color":"c9d1d9","border_color":"30363d"}

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            profile/snake-light.svg?color_snake=#b9404b&color_dots=#ebedf0,#f5d9dc,#eaa0a9,#d56a79,#b9404b
            profile/snake-dark.svg?palette=github-dark&color_snake=#f0747a&color_dots=#161b22,#54242c,#80343e,#b94a56,#f0747a

      - name: Generate contribution city with light and dark palettes
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Validate all seven generated images
        run: python3 scripts/check_profile.py --generated

      - name: Upload only validated images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-images
          overwrite: true
          if-no-files-found: error
          retention-days: 3
          path: |
            profile/stats-light.svg
            profile/stats-dark.svg
            profile/top-langs-light.svg
            profile/top-langs-dark.svg
            profile/snake-light.svg
            profile/snake-dark.svg
            profile-3d-contrib/profile-custom.svg

  publish:
    name: Publish validated images
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Download this run's validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-images
          path: ${{ runner.temp }}/profile-generated
          digest-mismatch: error

      - name: Copy the seven expected images
        env:
          PROFILE_ARTIFACT_DIR: ${{ runner.temp }}/profile-generated
        run: |
          set -euo pipefail
          for profile_file in \
            profile/stats-light.svg \
            profile/stats-dark.svg \
            profile/top-langs-light.svg \
            profile/top-langs-dark.svg \
            profile/snake-light.svg \
            profile/snake-dark.svg \
            profile-3d-contrib/profile-custom.svg
          do
            install -D -m 644 -- "$PROFILE_ARTIFACT_DIR/$profile_file" "$profile_file"
          done

      - name: Validate downloaded images
        run: python3 scripts/check_profile.py --generated

      - name: Commit and push only generated images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            profile/stats-light.svg \
            profile/stats-dark.svg \
            profile/top-langs-light.svg \
            profile/top-langs-dark.svg \
            profile/snake-light.svg \
            profile/snake-dark.svg \
            profile-3d-contrib/profile-custom.svg
          if git diff --cached --quiet; then
            echo "Profile images are already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated visuals"
          git push origin HEAD:main
